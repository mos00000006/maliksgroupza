name: Deploy Maliks Group Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maliks-group-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MALIKS_GROUP_D1_DATABASE_ID: ${{ secrets.MALIKS_GROUP_D1_DATABASE_ID }}
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and build
        run: npm run check

      - name: Prepare production configuration
        run: npm run config:production

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply maliks-group-hub-db --remote --config .deploy/wrangler.jsonc

      - name: Deploy full Hub
        run: npx wrangler deploy --config dist/server/wrangler.json
